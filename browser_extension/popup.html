<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MindGuard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      background: #080c14;
      color: #cdd9f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #0d1220 0%, #0a1628 100%);
      border-bottom: 1px solid #1e2d45;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-dot { color: #06b6d4; font-size: 18px; }
    .header-title { font-size: 16px; font-weight: 700; color: #e8f0ff; letter-spacing: 0.5px; }
    .header-sub   { font-size: 10px; color: #4a6080; margin-top: 1px; }

    /* ── Toggle row ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #1e2d45;
    }
    .toggle-label { font-size: 12px; color: #cdd9f0; }
    .toggle-sub   { font-size: 10px; color: #4a6080; margin-top: 2px; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 42px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #1e2d45;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.25s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: #4a6080;
      border-radius: 50%;
      transition: transform 0.25s, background 0.25s;
    }
    input:checked + .slider { background: #1d4ed8; }
    input:checked + .slider::before { transform: translateX(20px); background: #e8f0ff; }

    /* ── Risk badge ── */
    .risk-section {
      padding: 14px 16px;
      border-bottom: 1px solid #1e2d45;
    }
    .risk-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #1e2d45;
      background: #111827;
    }
    .risk-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .risk-label { font-weight: 700; font-size: 13px; }
    .risk-score { font-size: 11px; color: #4a6080; margin-top: 2px; }
    .risk-time  { font-size: 10px; color: #2a4a7f; margin-left: auto; }

    /* ── Stats ── */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #1e2d45;
    }
    .stat-card {
      background: #111827;
      border: 1px solid #1e2d45;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .stat-val { font-size: 18px; font-weight: 700; color: #e8f0ff; }
    .stat-key { font-size: 9px; color: #4a6080; margin-top: 2px; letter-spacing: 0.5px; }

    /* ── Disclaimer ── */
    .disclaimer {
      padding: 10px 16px 14px;
      font-size: 10px;
      color: #2a4a7f;
      line-height: 1.5;
      text-align: center;
    }
    .disclaimer a { color: #3b82f6; text-decoration: none; }

    /* ── Status dot ── */
    .api-status {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 10px;
      color: #4a6080;
      border-top: 1px solid #1e2d45;
    }
    .api-dot { width: 6px; height: 6px; border-radius: 50%; background: #4a6080; }
    .api-dot.online  { background: #10b981; }
    .api-dot.offline { background: #ef4444; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="logo-dot">◆</span>
    <div>
      <div class="header-title">MindGuard</div>
      <div class="header-sub">Browser Monitoring Extension</div>
    </div>
  </div>

  <!-- Toggle -->
  <div class="toggle-row">
    <div>
      <div class="toggle-label">Text Monitoring</div>
      <div class="toggle-sub" id="toggle-sub">Disabled — click to enable</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="monitoring-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <!-- Risk Badge -->
  <div class="risk-section">
    <div class="risk-badge" id="risk-badge">
      <div class="risk-dot" id="risk-dot" style="background:#4a6080;"></div>
      <div>
        <div class="risk-label" id="risk-label">No data yet</div>
        <div class="risk-score" id="risk-score">Enable monitoring to begin</div>
      </div>
      <div class="risk-time" id="risk-time">—</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-val" id="stat-total">0</div>
      <div class="stat-key">TOTAL</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-high" style="color:#f97316;">0</div>
      <div class="stat-key">HIGH</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="stat-crisis" style="color:#ef4444;">0</div>
      <div class="stat-key">CRISIS</div>
    </div>
  </div>

  <!-- Disclaimer -->
  <div class="disclaimer">
    This tool is for support only — not a clinical diagnostic.
    <br>In a crisis? Call or text <strong style="color:#ef4444;">988</strong>
    or text <strong>HOME</strong> to <strong>741741</strong>.
  </div>

  <!-- API Status -->
  <div class="api-status">
    <div class="api-dot" id="api-dot"></div>
    <span id="api-status-text">Checking backend...</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
